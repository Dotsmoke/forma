<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1F3B2D">
<title>Admin | Marsuki</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="admin.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js" defer></script>
<script src="admin.js" defer></script></head>
<body>

<!-- ============ Sign in ============ -->
<main class="login" id="login">
  <form class="lcard" id="lform" autocomplete="on">
    <div class="llogo"><i class="fa-solid fa-leaf"></i>Marsuki</div>
    <h1>Admin sign in</h1>
    <p class="muted">Manage orders and products.</p>
    <label>Username<input id="lu" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label>Password<span class="pw"><input id="lp" name="password" type="password" autocomplete="current-password" required><button type="button" id="lshow" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></span></label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn" id="lbtn" type="submit">Sign in</button>
    <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to shop</a>
  </form>
</main>

<!-- ============ App ============ -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="alogo" href="admin.html"><i class="fa-solid fa-leaf"></i>Marsuki<span>Admin</span></a>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button type="button" data-tab="orders" aria-current="page"><i class="fa-solid fa-bag-shopping"></i><span>Orders</span><b id="newBadge" hidden></b></button>
        <button type="button" data-tab="products"><i class="fa-solid fa-jar"></i><span>Products</span></button>
      </nav>
      <div class="tact">
        <button class="ib" id="refresh" type="button" aria-label="Refresh data" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
        <a class="ib" href="index.html" target="_blank" rel="noopener" aria-label="View shop" title="View shop"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        <button class="ib" id="logout" type="button" aria-label="Sign out" title="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </header>

  <main class="page">
    <section id="p-orders">
      <div class="stats" id="stats"></div>
      <div class="bar">
        <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="oq" type="search" placeholder="Search name, phone, order ID, item" autocomplete="off"></div>
        <div class="chips" id="ofilters" role="group" aria-label="Filter by status"></div>
      </div>
      <div class="olist" id="olist"></div>
    </section>

    <section id="p-products" hidden>
      <div class="bar">
        <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="pq" type="search" placeholder="Search products" autocomplete="off"></div>
        <button class="btn" id="addP" type="button"><i class="fa-solid fa-plus"></i>Add product</button>
      </div>
      <div class="pgrid" id="plist"></div>
    </section>
  </main>
</div>

<!-- ============ Side panel (order details / product editor) ============ -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <header class="dh"><h2 id="dTitle"></h2><button class="ib" id="dClose" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></header>
  <div class="db" id="dBody"></div>
  <footer class="df" id="dFoot" hidden></footer>
</aside>
<div class="toast" id="toast" role="status"></div>
</body></html>
